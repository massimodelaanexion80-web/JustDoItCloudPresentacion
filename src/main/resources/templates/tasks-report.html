
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JustDoIt! - Reporte de tareas</title>

    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <style>
        .report-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        .report-table th,
        .report-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        .report-table th {
            background-color: #1f3a5f;
            color: white;
        }

        .report-table tr:hover {
            background-color: #f5f7fa;
        }

        .table-container {
            overflow-x: auto;
        }
    </style>
</head>

<body>
<div class="container">

    <!-- Panel izquierdo -->
    <aside class="sidebar">

        <div class="logo">
            <a th:href="@{/}">
                <img th:src="@{/images/JustDoIt.png}"
                     alt="JustDoIt Logo"
                     width="200" height="200">
            </a>
        </div>

        <nav class="navigation">
            <h3>Tareas</h3>
            <ul>
                <li>
                    <a th:href="@{/user/tasks}">
                        Tareas de usuario actual
                    </a>
                </li>
                <li>
                    <a th:href="@{/user/tasks/report}">
                        Reporte de tareas
                    </a>
                </li>
            </ul>
        </nav>

    </aside>

    <!-- Contenido principal -->
    <main class="content">

        <h1>Reporte de tareas del usuario</h1>

        <!-- Información del usuario -->
        <div th:replace="~{fragments/user-info :: userInfo}"></div>

        <h2>Listado de tareas</h2>

        <div class="table-container">
            <table class="report-table">

                <thead>
                <tr>
                    <th>Tarea</th>
                    <th>Estado</th>
                    <th>Fecha Límite</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="task : ${user.tasks}">

                    <td th:text="${task.description}">
                        Descripción de tarea
                    </td>

                    <td th:switch="${task.status.name()}">
                        <span th:case="'PENDING'">Pendiente</span>
                        <span th:case="'INPROGRESS'">En progreso</span>
                        <span th:case="'DONE'">Completada</span>
                        <span th:case="*">Desconocido</span>
                    </td>

                    <td>
                        <span th:if="${task.deadline != null}"
                              th:text="${#temporals.format(task.deadline, 'dd/MMMM/yyyy')}">
                            Fecha
                        </span>

                        <span th:if="${task.deadline == null}">
                            No especificada
                        </span>
                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(user.tasks)}">
                    <td colspan="3">
                        No hay tareas registradas.
                    </td>
                </tr>

                </tbody>
            </table>
        </div>

    </main>

</div>
</body>
</html>
